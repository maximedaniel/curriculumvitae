project:
  type: website
  render:
    - "*.qmd"
    - "!notes/"
    - "!sources/"
  resources:
    - "pages/research/slr/**"

filters: ["filters/main.lua"]

website:
  title: "Home"
  navbar:
    left:
      - pages/research/research.qmd
    right:
      - text: "Misc"
        menu:
          - pages/teaching/user-scenario.qmd
          - pages/teaching/design-methods.qmd
          - pages/teaching/paper-writing.qmd
          - pages/teaching/presentation-template.qmd


format:
  html:
    theme:
      - cosmo
    css:
      - assets/css/style.css
    toc: true
    include-in-header:
      text: |
        <meta name="google-site-verification" content="MN4fn86K1DpKV0jR0rbbUHYzjk9MwgfsGbGnSNdN4CI">
        <script type="application/javascript" src="/assets/js/jquery-3.7.1.min.js"></script>
    include-after-body:
      text: |
        <script type="application/javascript" src="/assets/js/video_embedding.js"></script>
        <script type="application/javascript" src="/assets/js/btn_collapse.js"></script>
        <script type="application/javascript" src="/assets/js/printable.js"></script>
